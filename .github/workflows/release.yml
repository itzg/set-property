name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  release:
    uses: itzg/github-workflows/.github/workflows/go-with-releaser.yml@main
    with:
      go-version-file: go.mod
    secrets:
      scoop-tap-github-token: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
